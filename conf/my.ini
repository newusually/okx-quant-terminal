# =============================================================================
#  my.ini —— OKX 量化系统专用 MySQL 8.0 配置
#  场景：400+ 合约并发写入 + 高频查询，机器 2C / 2GB 内存，需兼顾内存占用
#  端口：3306（仅本机 127.0.0.1，不对外暴露）
# =============================================================================

[client]
port            = 3306
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4
prompt          = "okx-mysql> "

[mysqld]
# ---------- 基础路径 ----------
basedir         = C:/Users/Administrator/Documents/finally/mysql
datadir         = C:/Users/Administrator/Documents/finally/mysql/data
tmpdir          = C:/Users/Administrator/Documents/finally/mysql/tmp
log-error       = C:/Users/Administrator/Documents/finally/logs/mysql-error.log
pid-file        = C:/Users/Administrator/Documents/finally/mysql/data/mysqld.pid
plugin-dir      = C:/Users/Administrator/Documents/finally/mysql/lib/plugin

# ---------- 网络 ----------
port            = 3306
bind-address    = 127.0.0.1
# 400+ 合约并发：连接数要给够，同时跳过 DNS 反查省掉每连接的解析开销
max_connections = 500
max_connect_errors = 100000
# 跳过 DNS 反查：400+ 合约并发时每连接省掉一次解析，连接建立快很多
skip_name_resolve = ON
back_log        = 512

# ---------- 字符集 ----------
character-set-server = utf8mb4
collation-server     = utf8mb4_general_ci
skip-character-set-client-handshake = OFF

# ---------- InnoDB（核心） ----------
default-storage-engine = InnoDB
# 内存只有 2GB，缓冲池给 320M —— 刚好覆盖热数据（合约表 + ticker + 近期 K 线）
innodb_buffer_pool_size = 320M
innodb_buffer_pool_instances = 2
# 提交刷盘策略 2 = 只写 OS 缓存，每秒 fsync 一次：批量插入速度提升 5~10 倍
innodb_flush_log_at_trx_commit = 2
innodb_log_buffer_size  = 32M
innodb_log_file_size    = 96M
innodb_log_files_in_group = 2
innodb_flush_method     = unbuffered
innodb_io_capacity      = 2000
innodb_io_capacity_max  = 4000
innodb_read_io_threads  = 4
innodb_write_io_threads = 4
# 0 = 不限制并发线程，由 InnoDB 自适应（2 核机器交给它自己调度最稳）
innodb_thread_concurrency = 0
innodb_file_per_table   = 1
# 2 = interleaved，批量插入时不再抢 AUTO_INCREMENT 表锁，并发插入提升明显
innodb_autoinc_lock_mode = 2
innodb_lru_scan_depth   = 1024
innodb_change_buffering = all
innodb_adaptive_hash_index = ON
innodb_purge_threads    = 2
# 表空间自动扩展，每次扩 32M
innodb_autoextend_increment = 32

# ---------- 连接与线程 ----------
thread_cache_size     = 64
table_open_cache      = 2000
table_definition_cache = 1000
open_files_limit      = 20000

# ---------- 排序/临时表（小内存保守设置） ----------
sort_buffer_size      = 2M
join_buffer_size      = 2M
read_buffer_size      = 512K
read_rnd_buffer_size  = 512K
tmp_table_size        = 64M
max_heap_table_size   = 64M
bulk_insert_buffer_size = 64M

# ---------- MyISAM 兜底（基本不用） ----------
key_buffer_size       = 16M

# ---------- 包与 SQL ----------
max_allowed_packet    = 64M
net_read_timeout      = 120
net_write_timeout     = 240
wait_timeout          = 28800
interactive_timeout   = 28800
sql_mode = STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION

# ---------- 日志（省内存：关慢日志开销大的部分，保留错误日志） ----------
# 2GB 内存机器上 performance_schema 吃掉 200~400M，直接关掉
performance_schema    = OFF
slow_query_log        = ON
slow_query_log_file   = C:/Users/Administrator/Documents/finally/logs/mysql-slow.log
long_query_time       = 1
log_queries_not_using_indexes = OFF
# 通用查询日志开销大，默认关闭（需要排查时再开）
general_log           = OFF
general_log_file      = C:/Users/Administrator/Documents/finally/logs/mysql-general.log

# ---------- 其它 ----------
explicit_defaults_for_timestamp = 1
lower_case_table_names = 1
local_infile          = ON
secure_file_priv      = C:/Users/Administrator/Documents/finally/mysql/tmp
log_bin               = OFF
# 8.0 默认 caching_sha2_password；驱动已支持，这里保持默认并额外建 native 账号兜底
mysqlx                = OFF

[mysqldump]
quick
max_allowed_packet = 64M
default-character-set = utf8mb4
